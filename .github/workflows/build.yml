name: Build ArmorPaint for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Get ArmorPaint source
        uses: actions/checkout@v4
        with:
          repository: armory3d/armorpaint
          ref: main

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # Critical: prevent Defender from deleting amake.exe
      - name: Allow amake.exe
        shell: pwsh
        run: |
          $amake = "base\tools\bin\windows_x64\amake.exe"
          if (Test-Path $amake) {
            Add-MpPreference -ExclusionPath (Resolve-Path $amake)
            Unblock-File $amake
            Write-Host "amake.exe unblocked and excluded from Defender"
          } else {
            throw "amake.exe not found – checkout may be incomplete"
          }

      - name: Generate Windows project
        shell: cmd
        working-directory: paint
        run: |
          ..\base\make
          if not exist build\ArmorPaint.sln (
            echo ERROR: ArmorPaint.sln was not generated
            dir /s /b build 2>nul
            exit /b 1
          )
          echo Successfully generated build\ArmorPaint.sln

      - name: Compile ArmorPaint
        shell: cmd
        working-directory: paint
        run: msbuild build\ArmorPaint.sln /m /p:Configuration=Release /p:Platform=x64 /v:minimal

      - name: Collect build output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exe = Get-ChildItem paint -Filter ArmorPaint.exe -Recurse |
                 Where-Object { $_.FullName -notmatch '\\obj\\|\\Debug\\' } |
                 Select-Object -First 1

          if (-not $exe) { throw "ArmorPaint.exe was not found" }
          Write-Host "Found: $($exe.FullName)"

          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item $exe.FullName package\ArmorPaint.exe

          # Prefer the data folder produced by the generate step
          $data = $null
          foreach ($candidate in @(
              "paint\build\out\data",
              "paint\build\data",
              "paint\data"
          )) {
            if (Test-Path $candidate) { $data = $candidate; break }
          }

          if (-not $data) {
            $data = Get-ChildItem paint -Directory -Recurse |
                    Where-Object { $_.Name -eq 'data' } |
                    Select-Object -First 1 -ExpandProperty FullName
          }

          if ($data) {
            Write-Host "Copying data from $data"
            Copy-Item $data package\data -Recurse
          } else {
            Write-Warning "No data folder found"
          }

          Compress-Archive package\* ArmorPaint-Windows.zip -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows
          path: ArmorPaint-Windows.zip
          if-no-files-found: error
