name: Build ArmorPaint for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Get ArmorPaint source
        uses: actions/checkout@v4
        with:
          repository: armory3d/armorpaint
          ref: main

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Generate Windows project
        shell: pwsh
        working-directory: paint
        run: |
          Write-Host "Current directory: $(Get-Location)"
          ..\base\make

          if (-not (Test-Path "build\ArmorPaint.slnx") -and -not (Test-Path "build\ArmorPaint.sln")) {
            Write-Host "=== Contents of paint\build\ ==="
            Get-ChildItem build -ErrorAction SilentlyContinue | Format-Table Name
            throw "Neither ArmorPaint.slnx nor ArmorPaint.sln was generated"
          }

          Write-Host "Project files generated successfully"

      - name: Compile ArmorPaint
        shell: cmd
        working-directory: paint
        run: |
          if exist build\ArmorPaint.slnx (
            msbuild build\ArmorPaint.slnx /m /p:Configuration=Release /p:Platform=x64 /v:minimal
          ) else (
            msbuild build\ArmorPaint.sln /m /p:Configuration=Release /p:Platform=x64 /v:minimal
          )

      - name: Collect build output
        shell: pwsh
        run: |
          $exe = Get-ChildItem paint -Filter ArmorPaint.exe -Recurse |
            Where-Object { $_.FullName -notmatch '\\obj\\' } |
            Select-Object -First 1

          if (-not $exe) {
            throw "ArmorPaint.exe was not found. Check the build logs."
          }

          Write-Host "Found executable: $($exe.FullName)"

          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item $exe.FullName package\

          # Prefer the already-exported data folder
          $data = $null
          if (Test-Path "paint\build\out\data") {
            $data = Get-Item "paint\build\out\data"
          } else {
            $data = Get-ChildItem paint -Directory -Recurse |
              Where-Object { $_.Name -eq 'data' } |
              Select-Object -First 1
          }

          if ($data) {
            Write-Host "Copying data from: $($data.FullName)"
            Copy-Item $data.FullName package\data -Recurse
          } else {
            Write-Host "WARNING: data folder not found"
          }

          Compress-Archive package\* ArmorPaint-Windows.zip -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows
          path: ArmorPaint-Windows.zip
          if-no-files-found: error
